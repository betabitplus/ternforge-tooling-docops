name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: ci
    uses: betabitplus/ternforge-infra-ci/.github/workflows/python-library.yml@d96ae241cb86351325d7ce7d9dfc3b3f1aa4101d # v5.7.2
    with:
      python-version: "3.13"
      runtime-audit-exclude-package: ""
      # sphinx-codelinks 1.4.0 intentionally requires click<8.2 for its CLI;
      # DocOps uses only the Sphinx extension and does not call vulnerable click.edit().
      runtime-audit-ignore-vulnerabilities: "PYSEC-2026-2132"
      playwright-browsers: ""
    secrets:
      app-private-key: ${{ secrets.TERNFORGE_SOURCE_READ_PRIVATE_KEY }}
