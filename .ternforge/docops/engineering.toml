[needs]
id_required = true
build_json = true
schema_definitions_from_json = "schemas.json"

[needs.fields.status]
description = "Lifecycle state for requirements, technical requirements, and architecture decisions."
schema.enum = ["draft", "proposed", "accepted", "rejected", "deprecated", "superseded"]

[needs.fields.revision]
description = "Human-managed semantic revision used by conditional trace links."
schema.type = "integer"
schema.minimum = 1

[needs.fields.decision_date]
description = "Date recorded for an architecture decision."
schema.type = "string"
schema.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

[needs.fields.experiment_date]
description = "Date on which an engineering experiment produced the recorded result."
schema.type = "string"
schema.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

[needs.fields.required_evidence]
description = "Minimal implementation and verification evidence required by this requirement."
schema.type = "array"
schema.items.type = "string"
schema.items.enum = ["impl", "bdd", "unit", "property", "integration", "e2e"]
schema.uniqueItems = true

[needs.fields.verification_kind]
description = "Verification evidence kind emitted by an execution evidence adapter."
schema.type = "string"
schema.enum = ["bdd", "unit", "property", "integration", "e2e"]

[needs.fields.gherkin_feature]
description = "Repository-relative Gherkin feature source for BDD evidence."
schema.type = "string"

[needs.fields.gherkin_scenario]
description = "Gherkin scenario name for BDD evidence."
schema.type = "string"

[needs.fields.nodeid]
description = "Exact pytest nodeid retained for one imported testcase."
schema.type = "string"

[needs.fields.scope_reach]
description = "Highest verification-scope rung established by captured execution facts."
schema.type = "string"
schema.enum = ["focused_logic", "component", "integration_boundary", "transport_sdk_filesystem", "public_workflow", "live_external_reality"]

[needs.fields.scope_basis]
description = "Captured-fact basis used to place verification evidence on the scope ladder."
schema.type = "string"

[needs.fields.external_reach]
description = "Observed terminal external relation for one verification execution."
schema.type = "string"
schema.enum = ["local", "substitute", "replay", "direct"]

[needs.fields.producer_role]
description = "Role played by an evidence producer in the verification chain."
schema.type = "string"
schema.enum = ["upstream-tool", "capture-pipeline", "evidence-transformer", "test-substitute", "presentation"]

[needs.fields.producer_version]
description = "Tool, owner release, or runtime-lock version basis for an evidence producer."
schema.type = "string"

[needs.fields.producer_impact]
description = "Consequence if an evidence producer is wrong and creates false confidence."
schema.type = "string"
schema.enum = ["low", "medium", "high"]

[needs.fields.producer_purpose]
description = "Concise purpose of an evidence producer."
schema.type = "string"

[needs.fields.risk_if_wrong]
description = "Assurance consequence if an evidence producer is wrong."
schema.type = "string"

[needs.fields.residual_doubt]
description = "Known residual uncertainty after qualification or calibration."
schema.type = "string"

[needs.fields.qualification_kind]
description = "Kind of evidence supporting trust in an evidence producer."
schema.type = "string"
schema.enum = ["upstream-trust", "unit-contract", "integration-contract", "cross-check", "golden-fixture"]

[needs.fields.evidence_url]
description = "Repository or retained-artifact URL supporting one qualification record."
schema.type = "string"

[needs.fields.target_version]
description = "Version, provider revision, or immutable target checked by qualification/manual evidence."
schema.type = "string"

[needs.fields.manual_date]
description = "Date on which a manual verification or calibration record was performed."
schema.type = "string"
schema.pattern = "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

[needs.fields.performed_by]
description = "Person, automation, or controlled procedure that performed a manual verification."
schema.type = "string"

[needs.fields.artifact_url]
description = "Retained artifact or immutable source URL supporting a manual verification record."
schema.type = "string"

[needs.fields.manual_scope]
description = "What the manual verification establishes."
schema.type = "string"

[needs.fields.limitation]
description = "Explicit limit of a manual verification or calibration record."
schema.type = "string"

[needs.fields.issue]
description = "GitHub issue numbers tracking this object; Sphinx-Needs remains authoritative."
schema.type = "array"
schema.items.type = "integer"
schema.uniqueItems = true

[needs.links.derives]
outgoing = "derives from"
incoming = "derived by"

[needs.links.implements]
outgoing = "implements"
incoming = "implemented by"

[needs.links.verifies]
outgoing = "verifies"
incoming = "verified by"

[needs.links.affects]
outgoing = "affects"
incoming = "affected by decision"

[needs.links.supersedes]
outgoing = "supersedes"
incoming = "superseded by"

[needs.links.informs]
outgoing = "informs"
incoming = "informed by experiment"

[needs.links.produced_by]
outgoing = "produced by"
incoming = "produces evidence"

[needs.links.qualified_by]
outgoing = "qualified by"
incoming = "qualifies producer"

[needs.links.calibrated_by]
outgoing = "calibrated by"
incoming = "calibrates producer"

[needs.links.calibrates]
outgoing = "calibrates"
incoming = "calibrated by record"

