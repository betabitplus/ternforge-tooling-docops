# ==============================================================================
# Build System Configuration
# ==============================================================================
[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=82.0.1" ]

# ==============================================================================
# Project Metadata
# ==============================================================================
[project]
name = "ternforge-docops"
version = "0.2.0"
description = "Language-agnostic documentation operations tooling for Ternforge repositories."
readme = "README.md"
keywords = [ "library", "python" ]
license = "MIT"
authors = [ { name = "betabitplus", email = "8123085+betabitplus@users.noreply.github.com" } ]
requires-python = ">=3.13"
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
# --- Main Dependencies ---
dependencies = [
  "docutils>=0.21,<0.23",
  "jupyter-client>=8.6,<9",
  "myst-nb>=1.4,<2",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pydata-sphinx-theme>=0.20",
  "sphinx>=8.2.3",
  "sphinx-codelinks>=1.4,<2",
  "sphinx-design>=0.6,<1",
  "sphinx-gallery>=0.21,<1",
  "sphinx-llm>=1,<2",
  "sphinx-mounts>=0.2,<0.3",
  "sphinx-needs>=8.4,<9",
  "sphinx-simplepdf>=1.7,<2",
  "sphinx-test-reports>=1.4,<2",
  "sphinxcontrib-mermaid>=2.1",
]
# --- Project URLs ---
urls."Bug Tracker" = "https://github.com/betabitplus/ternforge-tooling-docops/issues"
urls.Documentation = "https://github.com/betabitplus/ternforge-tooling-docops/tree/main/docs"
urls.Homepage = "https://github.com/betabitplus/ternforge-tooling-docops"
urls.Repository = "https://github.com/betabitplus/ternforge-tooling-docops"
scripts.ternforge-docops = "ternforge_docops._api.cli:main"

[dependency-groups]
dev = [
  "allure-pytest-bdd>=2.16,<3",
  # Security auditing
  "bandit>=1.9.4",
  "check-manifest>=0.51",
  "check-wheel-contents>=0.6.1",
  "commitizen>=4.16.3",
  # Project hygiene
  "deptry>=0.25.1",
  "flake8>=7.3",
  "flake8-class-attributes-order>=0.3",
  "flake8-cognitive-complexity>=0.1",
  "hypothesis>=6.155.3",
  "import-linter>=2.11",
  # Docs consistency
  "interrogate>=1.7",
  # Interactive development
  "ipykernel>=7.3",
  "ipytest>=0.14.2,<0.15",
  "ipython>=9.14.1",
  "mdformat>=0.7.22",
  "mdformat-beautysh>=1",
  "mdformat-frontmatter>=2.1.2",
  "mdformat-gfm>=1",
  "mdformat-ruff>=0.1.3",
  "mdformat-tables>=1",
  "nest-asyncio>=1.6",
  "pillow>=12.2",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6",
  # Shared repo tooling and test support
  "py-lib-policy",
  "py-lib-testkit",
  "pyproject-fmt>=2.23",
  "pyright>=1.1.410",
  "pytest>=9.1",
  "pytest-bdd>=8.1,<9",
  "pytest-cov>=7.1",
  "pytest-randomly>=4.1",
  "pytest-recording>=0.13.4",
  "pytest-xdist>=3.8",
  # Code quality and formatting
  "radon>=6.0.1",
  "rich>=15",
  "ruff>=0.15.17",
  "syrupy>=5.3.2",
  "twine>=6.2",
  "ty>=0.0.50",
  "types-pillow>=10.2.0.20240822",
  "validate-pyproject>=0.25",
]
docs = [
  "matplotlib>=3.11.1",
]

[tool.setuptools]
# Package discovery is scoped to `src/`; keep non-package code outside `src/`.
packages.find.where = [ "src" ]
packages.find.include = [ "*" ]
# ==============================================================================
# Setuptools Configuration
# ==============================================================================
package-dir."" = "src"
package-data.ternforge_docops = [
  "_internal/resources/graph/*.json",
  "_internal/resources/graph/*.toml",
  "_internal/resources/static/*.css",
]

[tool.uv]
required-version = "==0.12.5"
sources.py-lib-policy = { git = "https://github.com/betabitplus/ternforge-tooling-py-policy.git", tag = "v2.0.0" }
sources.py-lib-testkit = { git = "https://github.com/betabitplus/ternforge-tooling-py-testkit.git", tag = "v2.2.2" }

# ---------------- Ruff configuration ----------------
[tool.ruff]
# Target the project runtime Python version.
target-version = "py313"
# Match Black's defaults (line length = 88).
line-length = 88
# Captured experiment notebooks are evidence documents; lint their owned source instead.
extend-exclude = [ "experiments/**/report/*.ipynb" ]
# Enable auto-fixes for safe rules (`ruff check --fix`).
fix = true
# Format Python snippets inside docstrings.
format.docstring-code-format = true
# Useful rule sets:
# A = flake8-builtins (prevent shadowing builtins like list, dict)
# ANN = flake8-annotations (public typing discipline)
# ARG = unused arguments
# ASYNC = async correctness checks
# B = flake8-bugbear
# C4 = flake8-comprehensions
# C901 = complexity
# D = pydocstyle
# ERA = commented-out code
# F = Pyflakes
# FAST = FastAPI rules (harmless unless FastAPI appears)
# FBT = boolean trap checks
# FLY = prefer f-strings
# I = import sorting
# LOG = logging hygiene
# N = pep8-naming
# PERF = performance anti-patterns
# PGH = blanket noqa/type-ignore detection
# PIE = flake8-pie
# PLC, PLE, PLW = Pylint convention/error/warning rule groups
# PT = pytest style
# RUF = Ruff-specific checks
# S = Bandit security checks
# TC = type-checking import placement
lint.select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "C901",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "F",
  "FAST",
  "FBT",
  "FLY",
  "FURB",
  "G",
  "I",
  "ISC",
  "LOG",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "T10",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812",  # Trailing comma (conflicts with formatter)
  "ISC001",  # Implicit string concatenation (conflicts with formatter)
  "PLC0415", # import-outside-top-level (sometimes needed for lazy loading)
  "S603",    # subprocess without shell=True (handled by Bandit locally)
  "TC001",   # typing-only first-party import (enable after cleanup)
  "TC002",   # typing-only third-party import (enable after cleanup)
  "TC003",   # typing-only stdlib import (enable after cleanup)
  "UP047",   # Keep TypeVar-style generics for current type checkers
]
lint.per-file-ignores."examples/*" = [
  "D205",   # Sphinx-Gallery title underline follows the first docstring line.
  "D415",   # Gallery titles are headings, not prose sentences.
  "ERA001", # Sphinx-Gallery uses code-like configuration comments.
  "T20",    # Examples may print their public API output.
]
lint.per-file-ignores."experiments/*" = [
  "ANN",     # Experiment probes do not need full typing
  "C901",    # Provider/lab probes may keep linear scenario orchestration
  "D",       # Experiment probes can keep lightweight docs
  "E501",    # Preserve literal prompts and captured source without churn
  "EM",      # Direct contextual failure messages are acceptable in probes
  "PERF",    # Clarity matters more than micro-optimizing one-off probes
  "PLR0912", # Explicit experiment branches may stay linear
  "PLR0915", # Complete probe flows may remain procedural
  "PLR2004", # Allow scenario constants
  "S101",    # Allow assert statements
  "T20",     # Allow print statements
  "TRY003",  # Descriptive experiment exceptions may stay inline
]
# Scripts are utility code; keep them readable without production strictness.
lint.per-file-ignores."scripts/*" = [
  "ANN",    # No type annotation requirements
  "D",      # No docstring requirements
  "ERA001", # Allow commented-out experiments
  "T20",    # Allow print statements
]
lint.per-file-ignores."tests/*" = [
  "ANN",     # Type annotations not required everywhere
  "ARG005",  # Allow unused lambda arguments
  "D",       # Docstrings are useful but not required in every tiny test helper
  "DTZ",     # Allow naive datetime in fixtures
  "EM",      # Allow string literals in exceptions
  "ERA001",  # Allow commented-out exploratory cases
  "FBT",     # Allow boolean positional arguments
  "PLR0913", # Allow many function arguments in fixtures
  "PLR2004", # Allow magic values in assertions
  "PT012",   # Allow multi-statement pytest.raises blocks
  "S101",    # Allow assert statements
  "T20",     # Allow print statements in test diagnostics
  "TRY003",  # Allow long exception messages
]
# Ignore rules that are too noisy or conflict with formatter/project style.
lint.task-tags = [ "@impl", "FIXME", "TODO", "XXX" ]
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.isort.combine-as-imports = true
lint.isort.known-first-party = [ "ternforge_docops" ]
lint.pycodestyle.ignore-overlong-task-comments = true
# Choose docstring convention: "google", "numpy", or "pep257".
lint.pydocstyle.convention = "google"

# ---------------- Interrogate (docstring coverage) ----------------
[tool.interrogate]
fail-under = 100
# Require docstrings in production code.
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-semiprivate = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-setters = false
ignore-overloaded-functions = true
exclude = [ ".agents", "docs", "experiments", "scripts", "tests" ]
color = true
verbose = 1
quiet = false
omit-covered-files = true

# ---------------- Manifest validation ----------------
[tool.check-manifest]
ignore = [
  "*.egg-info/**",
  ".agents/**",
  ".copier-answers.yml",
  ".devcontainer/**",
  ".gherkin-lintrc",
  ".git/**",
  ".github/**",
  ".gitleaks.toml",
  ".markdown-link-check.json",
  ".markdownlint.yaml",
  ".mdformat.toml",
  ".pre-commit-config.yaml",
  ".pytest_cache/**",
  ".release-please-manifest.json",
  ".ruff_cache/**",
  ".ternforge/**",
  ".venv/**",
  ".vscode/**",
  "__pycache__/**",
  "docs/**",
  "examples/**",
  "experiments/**",
  "features/**",
  "plan/**",
  "release-please-config.json",
  "scripts/**",
  "SETUP.md",
  "tests/**",
  "typos.toml",
  "uv.lock",
]

# ---------------- Deptry (dependency hygiene) ----------------
[tool.deptry]
extend_exclude = [
  ".agents",
  ".venv",
  "examples",
  "experiments",
  "scripts",
  "tests",
]
per_rule_ignores.DEP002 = [
  "myst-nb",
  "pydata-sphinx-theme",
  "sphinx-codelinks",
  "sphinx-design",
  "sphinx-llm",
  "sphinx-mounts",
  "sphinx-simplepdf",
  "sphinx-test-reports",
  "sphinxcontrib-mermaid",
]
known_first_party = [ "ternforge_docops" ]

# ---------------- Bandit (security) ----------------
[tool.bandit]
exclude_dirs = [ ".agents", ".venv", "scripts", "tests" ]

# ---------------- Pyright configuration ----------------
[tool.pyright]
pythonVersion = "3.13"
venv = ".venv"
venvPath = "."
stubPath = "./.stubs"
typeCheckingMode = "strict"
# Exclude patterns.
exclude = [
  "**/__pycache__",
  "*.egg-info",
  ".agents",
  ".devcontainer",
  ".git",
  ".github",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  ".vscode",
  "docs/_build",
  "docs/auto_examples",
  "docs/generated",
  # Standalone experiment capsules own separate environments and import roots.
  "experiments",
  # Utility and verification code are checked by Ruff/pytest instead.
  "scripts",
  "tests",
]
# Relaxed: third-party stubs and dynamic runtime APIs can report false positives.
reportArgumentType = false
reportAttributeAccessIssue = false
reportInconsistentOverload = false
reportMissingTypeArgument = false
reportMissingTypeStubs = false
reportOptionalMemberAccess = false
reportOverlappingOverload = false
# Relaxed: tests may intentionally access private seams.
reportPrivateUsage = false
# Relaxed: dynamic library protocols can be stricter than runtime behavior.
reportReturnType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
# Relaxed: missing third-party stubs can flood unknown-type reports.
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
# Environment setup.
executionEnvironments = [ { root = "." } ]

[tool.ty]
# Exclude patterns matching Pyright configuration.
src.exclude = [
  "**/__pycache__/",
  "*.egg-info/",
  ".agents/",
  ".devcontainer/",
  ".git/",
  ".github/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  ".vscode/",
  "docs/_build/",
  "docs/auto_examples/",
  "docs/generated/",
  "experiments/",
  "scripts/",
  "tests/",
]
# ---------------- ty (Astral type checker) ----------------
environment.python-version = "3.13"
# Suppress rules that generate false positives or conflict with Pyright settings.
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.invalid-return-type = "ignore"
rules.possibly-missing-attribute = "ignore"
rules.unknown-argument = "ignore"
rules.unresolved-attribute = "ignore"

[tool.pytest]
ini_options.pythonpath = [ ".", "src" ]  # Enable imports from project root and src/
ini_options.norecursedirs = [
  "*.egg-info",
  ".git",
  ".hypothesis",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "build",
  "dist",
  "docs/_build",
  "docs/auto_examples",
  "docs/generated",
  "experiments",
  "scripts",
]
# ---------------- Pytest configuration ----------------
ini_options.addopts = "--cov --cov-report=term-missing --strict-markers"
ini_options.markers = [
  "hermetic: marks tests that run fully offline",
  "slow: marks tests that are slow and should be skipped in fast runs",
  "vcr: marks tests that use VCR.py for HTTP recording/replay",
]
ini_options.bdd_features_base_dir = "features"

[tool.coverage]
run.source = [ "src" ]
run.core = "ctrace"
# ---------------- pytest coverage ----------------
report.fail_under = 1

# ---------------- Commitizen (commit-message validation only) ----------------
[tool.commitizen]
name = "cz_conventional_commits"
allowed_prefixes = [ "Merge", "Revert", "WIP" ]

# ---------------- Ternforge project manifest ----------------
[tool.ternforge]
primary_package = "ternforge_docops"
package_names = [ "ternforge_docops" ]
env_prefix = "TERNFORGE_DOCOPS"
secrets.env_files = []

# ---------------- Import-linter architecture contracts ----------------
[tool.importlinter]
root_packages = [
  "examples",
  "ternforge_docops",
  "tests",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Root package must not be imported by the private implementation"
id = "root-not-imported-by-private-implementation"
type = "forbidden"
source_modules = [ "ternforge_docops._internal" ]
forbidden_modules = [ "ternforge_docops" ]
as_packages = false

[[tool.importlinter.contracts]]
name = "Root package must not be imported by the facade layer"
id = "root-not-imported-by-facade-layer"
type = "forbidden"
source_modules = [ "ternforge_docops._api" ]
forbidden_modules = [ "ternforge_docops" ]
as_packages = false

[[tool.importlinter.contracts]]
name = "Private implementation must not depend on public config facade"
id = "private-implementation-not-dependent-on-config-facade"
type = "forbidden"
source_modules = [ "ternforge_docops._internal" ]
forbidden_modules = [ "ternforge_docops._api.config" ]
as_packages = false

[[tool.importlinter.contracts]]
name = "Private implementation is only imported through product code and tests"
id = "private-implementation-approved-boundaries"
type = "protected"
protected_modules = [ "ternforge_docops._internal" ]
allowed_importers = [
  "ternforge_docops._api",
  "ternforge_docops._internal",
  "tests.ternforge_docops",
]

[[tool.importlinter.contracts]]
name = "Facade layer must import private implementation only through the private root"
id = "facade-private-imports-through-root"
type = "forbidden"
source_modules = [ "ternforge_docops._api" ]
forbidden_modules = [ "ternforge_docops._internal.**" ]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Ternforge DocOps examples must use the public package API"
id = "ternforge-docops-examples-public-api"
type = "forbidden"
source_modules = [ "examples.ternforge_docops" ]
forbidden_modules = [
  "ternforge_docops._api",
  "ternforge_docops._internal",
  "src",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Ternforge DocOps shipped package must not import examples"
id = "ternforge-docops-shipped-package-examples-boundary"
type = "forbidden"
source_modules = [ "ternforge_docops" ]
forbidden_modules = [ "examples" ]
allow_indirect_imports = true
